<div class="activity-timeline-section bg-white p-6 rounded-lg shadow-sm border border-gray-100 mt-6">
  <h3 class="text-lg font-semibold text-gray-800 mb-6">Activity History</h3>

  <!-- Loading State -->
  <div *ngIf="loading" class="flex justify-center my-4">
    <i class="pi pi-spin pi-spinner text-blue-500 text-3xl"></i>
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="text-red-500 bg-red-50 p-3 rounded mb-4 text-sm">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error">
    <!-- Empty State -->
    <div *ngIf="activities.length === 0" class="text-gray-500 text-center py-6 italic border border-dashed border-gray-300 rounded-lg">
      No activity recorded yet.
    </div>

    <!-- Timeline -->
    <p-timeline [value]="activities" align="alternate" styleClass="customized-timeline">
      <ng-template pTemplate="marker" let-activity>
        <span class="flex items-center justify-center w-8 h-8 rounded-full border-2 border-white shadow-sm bg-gray-50 z-10 relative">
          <i [class]="getIconForAction(activity.action_type) + ' text-lg'"></i>
        </span>
      </ng-template>
      <ng-template pTemplate="content" let-activity>
        <p-card [style]="{'margin-bottom': '1rem'}" styleClass="shadow-sm border border-gray-100 text-sm">
          <div class="flex flex-col">
            <div class="flex justify-between items-center border-b border-gray-100 pb-2 mb-2">
              <span class="font-semibold text-gray-800">{{ activity.action_type | titlecase }}</span>
              <span class="text-xs text-gray-500">{{ activity.created_at | date:'medium' }}</span>
            </div>
            <p class="text-gray-700 mb-2">{{ activity.details }}</p>
            <div class="text-xs text-gray-500 flex items-center gap-1 mt-1">
              <i class="pi pi-user text-gray-400 text-[10px]"></i>
              <span class="font-medium">{{ activity.actor_name }}</span>
              <span class="text-[10px] bg-gray-100 px-1.5 py-0.5 rounded ml-1">{{ activity.actor_role }}</span>
            </div>
          </div>
        </p-card>
      </ng-template>
    </p-timeline>
  </div>
</div>
