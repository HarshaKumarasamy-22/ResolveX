<div class="comments-section bg-white p-6 rounded-lg shadow-sm border border-gray-100 mt-6">
  <p-toast></p-toast>
  <h3 class="text-lg font-semibold text-gray-800 mb-4">Comments</h3>

  <!-- Loading State -->
  <div *ngIf="loading" class="flex justify-center my-4">
    <i class="pi pi-spin pi-spinner text-blue-500 text-3xl"></i>
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="text-red-500 bg-red-50 p-3 rounded mb-4 text-sm">
    {{ error }}
  </div>

  <!-- Comments List -->
  <div *ngIf="!loading && !error">
    <!-- Empty State -->
    <div *ngIf="comments.length === 0" class="text-gray-500 text-center py-6 italic border border-dashed border-gray-300 rounded-lg">
      No comments yet. Be the first to add one!
    </div>

    <!-- Loaded Comments -->
    <div class="space-y-4 mb-6">
      <div *ngFor="let comment of comments" class="bg-gray-50 p-4 rounded-lg flex gap-4">
        <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold flex-shrink-0">
          {{ comment.author_name.charAt(0) | uppercase }}
        </div>
        <div class="flex-1">
          <div class="flex items-baseline justify-between mb-1">
            <h4 class="font-medium text-gray-900">{{ comment.author_name }} <span class="text-xs text-gray-500 ml-2 font-normal py-0.5 px-2 bg-gray-200 rounded-full">{{ comment.author_role }}</span></h4>
            <span class="text-xs text-gray-500">{{ comment.created_at | date:'medium' }}</span>
          </div>
          <p class="text-gray-700 text-sm whitespace-pre-wrap">{{ comment.message }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Comment Form -->
  <div class="mt-6 border-t border-gray-100 pt-4">
    <textarea 
      [(ngModel)]="newMessage" 
      rows="3" 
      class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-3 bg-gray-50" 
      placeholder="Type your comment here...">
    </textarea>
    <div class="flex justify-end mt-3">
      <p-button 
        label="Post Comment" 
        icon="pi pi-send" 
        [loading]="submitting" 
        (onClick)="addComment()"
        styleClass="p-button-sm">
      </p-button>
    </div>
  </div>
</div>
